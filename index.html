<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C2B1E" />
    <meta name="description" content="Trilha — registre suas caminhadas, acompanhe distância, ritmo e conquistas." />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%230C2B1E'/%3E%3Cpath d='M9.2 5.4c1.5-.3 2.6 1 2.8 2.9.2 1.6-.4 2.9-1.8 3.2-1.4.3-2.5-.8-2.8-2.6-.3-1.7.3-3.2 1.8-3.5Zm.9 7.5c.9-.2 1.7.4 1.8 1.4l.2 1.6c.1.9-.5 1.7-1.4 1.9-.9.2-1.7-.4-1.8-1.3l-.2-1.7c-.1-.9.5-1.7 1.4-1.9Zm5-4.9c-1.5-.3-2.7 1-2.9 2.9-.2 1.6.4 2.9 1.8 3.2 1.4.3 2.5-.8 2.8-2.6.3-1.7-.3-3.2-1.7-3.5Zm-1 7.5c-.9-.2-1.7.4-1.8 1.4l-.2 1.6c-.1.9.5 1.7 1.4 1.9.9.2 1.7-.4 1.8-1.3l.2-1.7c.1-.9-.5-1.7-1.4-1.9Z' fill='%23FFC24B'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400..900;1,6..12,400..700&display=swap"
      rel="stylesheet"
    />
    <title>Trilha — diário de caminhadas</title>
    <style>
      #trilha-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(50rem 34rem at -10% -10%, rgba(140, 192, 160, 0.14), transparent 60%),
          radial-gradient(46rem 32rem at 110% 110%, rgba(255, 194, 75, 0.12), transparent 60%),
          #071f15;
        font-family: "Bricolage Grotesque", "Nunito Sans", system-ui, sans-serif;
        z-index: 5;
      }
      #trilha-splash .orb {
        position: relative;
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
        border-radius: 9999px;
        background: #0c2b1e;
        color: #ffc24b;
        box-shadow: 0 26px 60px -20px rgba(0, 0, 0, 0.7);
      }
      #trilha-splash .orb::before,
      #trilha-splash .orb::after {
        content: "";
        position: absolute;
        inset: -14px;
        border-radius: 9999px;
        border: 2px solid rgba(255, 194, 75, 0.35);
        animation: trilha-pulse 2.2s ease-out infinite;
      }
      #trilha-splash .orb::after {
        animation-delay: 1.1s;
      }
      @keyframes trilha-pulse {
        0% { transform: scale(0.72); opacity: 0.9; }
        100% { transform: scale(1.45); opacity: 0; }
      }
      #trilha-splash .name {
        color: #f2f6f0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #trilha-splash .name i {
        color: #ff6b3d;
        font-style: normal;
      }
      #trilha-splash .tag {
        margin-top: -14px;
        color: #8cc0a0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #trilha-splash .dots {
        display: flex;
        gap: 7px;
      }
      #trilha-splash .dots span {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: #2e7d55;
        animation: trilha-hop 1s ease-in-out infinite;
      }
      #trilha-splash .dots span:nth-child(2) { animation-delay: 0.15s; }
      #trilha-splash .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes trilha-hop {
        0%, 100% { transform: translateY(0); opacity: 0.5; }
        50% { transform: translateY(-7px); opacity: 1; }
      }
      #trilha-splash .hint {
        display: none;
        margin-top: 6px;
        color: #ffd678;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
        max-width: 280px;
        line-height: 1.5;
      }
      #trilha-splash.slow .hint { display: block; }
      #trilha-splash.slow .dots { display: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Tela de abertura: some sozinha quando o app carrega -->
      <div id="trilha-splash">
        <div class="orb">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M9.3 3.6c1.6-.3 2.8 1 3 3 .2 1.7-.4 3.1-1.9 3.4-1.5.3-2.7-.9-3-2.8-.3-1.8.3-3.3 1.9-3.6Zm1 8.1c1-.2 1.9.5 2 1.5l.3 1.9c.1 1-.6 1.9-1.6 2.1s-1.9-.5-2-1.5l-.3-1.9c-.1-1 .6-1.9 1.6-2.1Z" />
            <path d="M14.7 8.6c-1.6-.3-2.9 1-3.1 3-.2 1.7.4 3.1 1.9 3.4 1.5.3 2.7-.9 3-2.8.3-1.8-.3-3.3-1.8-3.6Zm-1.1 8.1c-1-.2-1.9.5-2 1.5l-.3 1.9c-.1 1 .6 1.9 1.6 2.1s1.9-.5 2-1.5l.3-1.9c.1-1-.6-1.9-1.6-2.1Z" opacity=".72" />
          </svg>
        </div>
        <div class="name">Trilha<i>.</i></div>
        <div class="tag">diário de caminhadas</div>
        <div class="dots"><span></span><span></span><span></span></div>
        <p class="hint">Ainda carregando… atualize a página de pré-visualização (botão de recarregar ↻) para ver a versão mais recente.</p>
      </div>
    </div>
    <script>
      // Se o app não montar em 6s, avisa no splash em vez de deixar a tela em branco
      window.setTimeout(function () {
        var s = document.getElementById("trilha-splash");
        if (s) s.classList.add("slow");
      }, 6000);

      // Mostra qualquer erro global (antes ou depois do React montar)
      function reportError(msg) {
        var hint = document.querySelector("#trilha-splash .hint");
        if (hint && document.getElementById("trilha-splash")) {
          hint.textContent = "Erro ao carregar: " + msg;
          hint.style.color = "#ffa283";
          hint.style.display = "block";
          var dots = document.querySelector("#trilha-splash .dots");
          if (dots) dots.style.display = "none";
          return;
        }
        var d = document.createElement("div");
        d.style.cssText =
          "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;max-width:406px;margin:0 auto;background:#0c2b1e;color:#ffd678;font:12px/1.45 ui-monospace,monospace;padding:10px 12px;border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.35);border:1px solid #1f6344";
        d.textContent = "Erro: " + msg;
        document.body.appendChild(d);
      }
      window.addEventListener("error", function (ev) {
        var file = ev.filename ? String(ev.filename).split("/").pop() : "";
        reportError((ev.message || "desconhecido") + (file ? " (" + file + ":" + ev.lineno + ")" : ""));
      });
      window.addEventListener("unhandledrejection", function (ev) {
        var r = ev.reason;
        reportError((r && r.message) || String(r));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
